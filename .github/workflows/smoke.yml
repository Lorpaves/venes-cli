# Tries the helper where it can't be tried at a desk: on Windows above all, and on Linux and macOS
# beside it. No Claude Code is signed in on these machines, so this is the helper's own plumbing: set
# up, reached by a client, told of a session by the hook's script, and asked and answered a permission.
name: smoke
on:
  push:
    branches: [main, windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke
        timeout-minutes: 5
        run: node test/smoke.mjs
      # The unit tests that are of Windows, or the same on any system. The rest were written for a Mac.
      - name: Unit tests that hold on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        timeout-minutes: 5
        run: node --test test/unit/winssh.test.mjs test/unit/winbin.test.mjs test/unit/wirepaths.test.mjs test/unit/qr.test.mjs test/unit/plugin.test.mjs test/unit/git.test.mjs test/unit/winconsole.test.mjs
